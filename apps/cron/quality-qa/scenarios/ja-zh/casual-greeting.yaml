scenario_id: TC-S1-zh
scenario: S1
name: 日常会話 / Daily Conversation
source_lang: ja
target_lang: zh
context: "10-turn daily conversation (ja→zh). Evaluates simplified Chinese output and natural expression."
audio_url: null
expected_keywords:
  - "你好"
  - "田中"
  - "摄影"
  - "富士山"
  - "Instagram"
turns:
  - turn: 1
    speaker: A
    script_text: "はじめまして、田中です。よろしくお願いします。"
    expected_translation: "你好，我叫田中。请多关照。"
    eval_point: "自己紹介の自然な中国語化・簡体字確認"
  - turn: 2
    speaker: B
    script_text: "你好！我叫李明，来自北京。"
    expected_translation: "こんにちは！私は李明といいます。北京から来ました。"
    eval_point: "固有名詞 (北京) の保持"
  - turn: 3
    speaker: A
    script_text: "趣味は写真撮影です。週末は山や海に行きます。"
    expected_translation: "我的爱好是摄影。周末我去山里或海边。"
    eval_point: "簡潔な文の自然さ・量詞"
  - turn: 4
    speaker: B
    script_text: "很棒！我也喜欢徒步旅行。你去过日本的名山吗？"
    expected_translation: "素晴らしいですね！私もハイキングが好きです。日本の有名な山に行ったことはありますか？"
    eval_point: "疑問文の自然な翻訳"
  - turn: 5
    speaker: A
    script_text: "はい、富士山に3回登ったことがあります。"
    expected_translation: "是的，我爬过3次富士山。"
    eval_point: "固有名詞 (富士山) + 量詞 (次)"
  - turn: 6
    speaker: B
    script_text: "哇，三次！山顶的景色一定很壮观。"
    expected_translation: "すごい、3回も！山頂の景色はきっと壮観でしょう。"
    eval_point: "感嘆文の翻訳"
  - turn: 7
    speaker: A
    script_text: "山頂での日の出が最高でした。空が赤やオレンジに染まって美しかったです。"
    expected_translation: "山顶的日出是最美的。天空被染成了红色和橙色，美极了。"
    eval_point: "情景描写・感情表現の精度"
  - turn: 8
    speaker: B
    script_text: "我能想象。你会把照片分享到网上吗？"
    expected_translation: "想像できます。写真をネットに公開しますか？"
    eval_point: "抽象的表現の翻訳"
  - turn: 9
    speaker: A
    script_text: "はい、Instagramに投稿しています。フォロワーが最近1000人を超えました。"
    expected_translation: "是的，我会发到Instagram上。最近粉丝超过1000人了。"
    eval_point: "SNS 固有名詞 + 数値"
  - turn: 10
    speaker: B
    script_text: "真厉害！我一定会关注你的。保持联系。"
    expected_translation: "それはすごい！フォローします。またご連絡しましょう。"
    eval_point: "締めくくり表現"
