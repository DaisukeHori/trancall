scenario_id: TC-S2-zh
scenario: S2
name: ビジネス会話 / Business Conversation
source_lang: ja
target_lang: zh
context: "10-turn business negotiation (ja→zh). Evaluates technical business terminology in simplified Chinese."
audio_url: null
expected_keywords:
  - "规格"
  - "交货期"
  - "折扣"
  - "取消条款"
  - "数字签名"
  - "保修"
turns:
  - turn: 1
    speaker: A
    script_text: "本日はお時間をいただきありがとうございます。新製品についてご提案させていただきます。"
    expected_translation: "感谢您今天抽出时间。我想就新产品向您提出提案。"
    eval_point: "ビジネス敬語の中国語化"
  - turn: 2
    speaker: B
    script_text: "当然。能告诉我规格和价格吗？"
    expected_translation: "もちろんです。仕様と価格について教えていただけますか？"
    eval_point: "仕様・価格の専門用語"
  - turn: 3
    speaker: A
    script_text: "はい。本製品の納期は発注から6週間、見積もり金額は税別で250万円になります。"
    expected_translation: "是的。本产品的交货期为订货后6周，报价为税前250万日元。"
    eval_point: "納期・大きな数値の中国語化"
  - turn: 4
    speaker: B
    script_text: "明白了。价格可以商量吗？我们的预算有限。"
    expected_translation: "なるほど。価格交渉は可能ですか？予算に限りがありまして。"
    eval_point: "交渉・予算の語彙"
  - turn: 5
    speaker: A
    script_text: "10台以上のご発注であれば、5%の割引が可能です。キャンセル条項については書面でご確認いただけます。"
    expected_translation: "如果订购10台以上，可以给予5%的折扣。取消条款可以以书面形式确认。"
    eval_point: "数量条件・キャンセル条項"
  - turn: 6
    speaker: B
    script_text: "好的，我需要先经过采购团队的批准。"
    expected_translation: "承知しました。まず購買チームの承認が必要になります。"
    eval_point: "組織内手続きの語彙"
  - turn: 7
    speaker: A
    script_text: "ご承認後、正式な契約書を作成いたします。デジタル署名での対応も可能です。"
    expected_translation: "批准后，我们将准备正式合同。也支持数字签名。"
    eval_point: "契約・デジタル署名"
  - turn: 8
    speaker: B
    script_text: "好的。这个产品的保修期是多久？"
    expected_translation: "わかりました。この製品の保証期間はどのくらいですか？"
    eval_point: "保証期間の語彙"
  - turn: 9
    speaker: A
    script_text: "製品保証は1年間です。延長保証オプションも別途ご用意しています。"
    expected_translation: "产品保修期为1年。另外还提供延长保修选项。"
    eval_point: "保証・オプション"
  - turn: 10
    speaker: B
    script_text: "谢谢。我们会审查提案，并在本周末前给您答复。"
    expected_translation: "ありがとうございます。提案書を確認し、週末までにご回答します。"
    eval_point: "締めくくり + 期限"
