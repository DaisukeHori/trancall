scenario_id: TC-S2-ko
scenario: S2
name: 비즈니스 회화 / Business Conversation
source_lang: ja
target_lang: ko
context: "10-turn business negotiation (ja→ko). Evaluates 합니다体 and Korean business terminology."
audio_url: null
expected_keywords:
  - "사양"
  - "납기"
  - "할인"
  - "취소 조항"
  - "디지털 서명"
  - "보증"
turns:
  - turn: 1
    speaker: A
    script_text: "本日はお時間をいただきありがとうございます。新製品についてご提案させていただきます。"
    expected_translation: "오늘 시간을 내주셔서 감사합니다. 신제품에 대한 제안을 드리겠습니다."
    eval_point: "ビジネス敬語 (합니다体) の保持"
  - turn: 2
    speaker: B
    script_text: "물론입니다. 사양과 가격을 알려주실 수 있나요?"
    expected_translation: "もちろんです。仕様と価格について教えていただけますか？"
    eval_point: "仕様・価格の専門用語"
  - turn: 3
    speaker: A
    script_text: "はい。本製品の納期は発注から6週間、見積もり金額は税別で250万円になります。"
    expected_translation: "네. 납기는 주문 후 6주이며, 견적 금액은 세전 250만 엔입니다."
    eval_point: "納期・大きな数値の韓国語化"
  - turn: 4
    speaker: B
    script_text: "알겠습니다. 가격 협상이 가능한가요? 예산이 한정되어 있어서요."
    expected_translation: "なるほど。価格交渉は可能ですか？予算に限りがありまして。"
    eval_point: "交渉・予算の語彙"
  - turn: 5
    speaker: A
    script_text: "10台以上のご発注であれば、5%の割引が可能です。キャンセル条項については書面でご確認いただけます。"
    expected_translation: "10대 이상 주문하시면 5% 할인이 가능합니다. 취소 조항은 서면으로 확인하실 수 있습니다."
    eval_point: "数量条件・キャンセル条項"
  - turn: 6
    speaker: B
    script_text: "알겠습니다. 먼저 구매팀의 승인이 필요합니다."
    expected_translation: "承知しました。まず購買チームの承認が必要になります。"
    eval_point: "組織内手続きの語彙"
  - turn: 7
    speaker: A
    script_text: "ご承認後、正式な契約書を作成いたします。デジタル署名での対応も可能です。"
    expected_translation: "승인 후 정식 계약서를 작성하겠습니다. 디지털 서명도 가능합니다."
    eval_point: "契約・デジタル署名"
  - turn: 8
    speaker: B
    script_text: "알겠습니다. 이 제품의 보증 기간은 얼마나 되나요?"
    expected_translation: "わかりました。この製品の保証期間はどのくらいですか？"
    eval_point: "保証期間の語彙"
  - turn: 9
    speaker: A
    script_text: "製品保証は1年間です。延長保証オプションも別途ご用意しています。"
    expected_translation: "제품 보증은 1년입니다. 연장 보증 옵션도 별도로 제공하고 있습니다."
    eval_point: "保証・オプション"
  - turn: 10
    speaker: B
    script_text: "감사합니다. 제안서를 검토하고 이번 주 말까지 연락드리겠습니다."
    expected_translation: "ありがとうございます。提案書を確認し、週末までにご回答します。"
    eval_point: "締めくくり + 期限"
