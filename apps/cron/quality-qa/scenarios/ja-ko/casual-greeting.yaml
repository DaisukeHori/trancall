scenario_id: TC-S1-ko
scenario: S1
name: 일상 대화 / Daily Conversation
source_lang: ja
target_lang: ko
context: "10-turn daily conversation (ja→ko). Evaluates Korean honorific register and natural expression."
audio_url: null
expected_keywords:
  - "처음 뵙겠습니다"
  - "다나카"
  - "사진"
  - "후지산"
  - "인스타그램"
turns:
  - turn: 1
    speaker: A
    script_text: "はじめまして、田中と申します。よろしくお願いします。"
    expected_translation: "처음 뵙겠습니다. 다나카라고 합니다. 잘 부탁드립니다."
    eval_point: "敬語 (합니다体) の保持・固有名詞"
  - turn: 2
    speaker: B
    script_text: "안녕하세요! 저는 김민준이에요. 서울에서 전화하고 있어요."
    expected_translation: "こんにちは！私はキム・ミンジュンです。ソウルから電話しています。"
    eval_point: "固有名詞 (ソウル、人名) の保持"
  - turn: 3
    speaker: A
    script_text: "趣味は写真撮影です。特に風景写真が好きで、週末は山や海に行きます。"
    expected_translation: "제 취미는 사진 촬영이에요. 특히 풍경 사진을 좋아해서 주말에는 산이나 바다에 가요."
    eval_point: "해요体での自然な翻訳"
  - turn: 4
    speaker: B
    script_text: "멋지네요! 저도 하이킹을 즐겨요. 일본의 유명한 산에 가본 적 있어요?"
    expected_translation: "素晴らしいですね！私もハイキングが好きです。日本の有名な山に行ったことはありますか？"
    eval_point: "疑問文の翻訳・経験表現"
  - turn: 5
    speaker: A
    script_text: "はい、富士山に3回登ったことがあります。とても達成感がありました。"
    expected_translation: "네, 후지산에 3번 올라간 적 있어요. 성취감이 정말 컸어요."
    eval_point: "固有名詞 (후지산) + 回数"
  - turn: 6
    speaker: B
    script_text: "와, 세 번이나! 정상에서 일출을 보셨나요?"
    expected_translation: "すごい、3回も！山頂で日の出を見ましたか？"
    eval_point: "感嘆・疑問の組み合わせ"
  - turn: 7
    speaker: A
    script_text: "山頂での日の出が最高でした。空が赤やオレンジに染まって、言葉にならないほど美しかったです。"
    expected_translation: "정상에서 보는 일출이 최고였어요. 하늘이 빨갛고 주황빛으로 물들어서 말로 표현할 수 없을 만큼 아름다웠어요."
    eval_point: "情景描写・感情表現"
  - turn: 8
    speaker: B
    script_text: "상상이 돼요. 사진을 온라인에 공유하시나요?"
    expected_translation: "想像できます。写真をオンラインで公開していますか？"
    eval_point: "敬語レベルの一貫性"
  - turn: 9
    speaker: A
    script_text: "はい、Instagramに投稿しています。フォロワーが最近1000人を超えました。"
    expected_translation: "네, 인스타그램에 올리고 있어요. 팔로워가 최근 1000명을 넘었어요."
    eval_point: "SNS 固有名詞 + 数値"
  - turn: 10
    speaker: B
    script_text: "대단하네요! 꼭 팔로우할게요. 계속 연락해요."
    expected_translation: "それはすごい！フォローしますね。またご連絡しましょう。"
    eval_point: "締めくくり表現"
