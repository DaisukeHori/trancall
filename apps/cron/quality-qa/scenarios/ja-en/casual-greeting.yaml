scenario_id: TC-S1-en
scenario: S1
name: 日常会話 / Daily Conversation
source_lang: ja
target_lang: en
context: "10-turn daily conversation covering self-introduction and hobbies. Evaluates fluency and context retention."
audio_url: null
expected_keywords:
  - "nice to meet you"
  - "photography"
  - "Mt. Fuji"
  - "Instagram"
  - "followers"
turns:
  - turn: 1
    speaker: A
    script_text: "はじめまして、田中と申します。よろしくお願いします。"
    expected_translation: "Nice to meet you. My name is Tanaka. I look forward to working with you."
    eval_point: "謙譲表現の自然な英語化"
  - turn: 2
    speaker: B
    script_text: "Hello! I'm John, calling from Seattle. Nice to meet you too."
    expected_translation: "こんにちは！シアトルからかけているジョンです。こちらこそよろしくお願いします。"
    eval_point: "固有名詞 (Seattle, John) の保持"
  - turn: 3
    speaker: A
    script_text: "趣味は写真撮影です。特に風景写真が好きで、週末は山や海に行きます。"
    expected_translation: "My hobby is photography. I especially love landscape shots, and on weekends I go to the mountains or the sea."
    eval_point: "複数趣味の正確な伝達"
  - turn: 4
    speaker: B
    script_text: "That's great! I enjoy hiking as well. Have you been to any famous mountains in Japan?"
    expected_translation: "それはいいですね！私もハイキングが好きです。日本の有名な山に行ったことはありますか？"
    eval_point: "疑問文の自然な翻訳"
  - turn: 5
    speaker: A
    script_text: "はい、富士山に3回登ったことがあります。とても達成感がありました。"
    expected_translation: "Yes, I've climbed Mt. Fuji three times. It was really fulfilling."
    eval_point: "固有名詞 (富士山) + 回数"
  - turn: 6
    speaker: B
    script_text: "Wow, three times! That must be quite a challenge. What was the most memorable part?"
    expected_translation: "すごい、3回も！かなり大変だったでしょう。一番印象に残った部分は何ですか？"
    eval_point: "感嘆・疑問の組み合わせ"
  - turn: 7
    speaker: A
    script_text: "山頂での日の出が最高でした。空が赤やオレンジに染まって、言葉にならないほど美しかったです。"
    expected_translation: "The sunrise at the summit was the best. The sky was dyed red and orange—it was so beautiful, words can't describe it."
    eval_point: "情景描写・感情表現の精度"
  - turn: 8
    speaker: B
    script_text: "I can imagine. Nature really puts things in perspective. Do you share your photos online?"
    expected_translation: "想像できます。自然は本当に物事を別の視点で見せてくれますよね。写真はオンラインで公開していますか？"
    eval_point: "抽象的表現の文脈保持"
  - turn: 9
    speaker: A
    script_text: "はい、Instagramに投稿しています。フォロワーが最近1000人を超えました。"
    expected_translation: "Yes, I post on Instagram. My followers recently exceeded 1,000."
    eval_point: "SNS 固有名詞 + 数値"
  - turn: 10
    speaker: B
    script_text: "That's impressive! I'll make sure to follow you. Let's keep in touch."
    expected_translation: "それはすごい！フォローしますね。またご連絡しましょう。"
    eval_point: "締めくくり表現の自然さ"
