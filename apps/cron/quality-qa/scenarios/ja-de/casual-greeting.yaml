scenario_id: TC-S1-de
scenario: S1
name: Alltägliches Gespräch / Daily Conversation
source_lang: ja
target_lang: de
context: "10-turn daily conversation (ja→de). Evaluates noun gender, natural German expression."
audio_url: null
expected_keywords:
  - "Freut mich"
  - "Fotografie"
  - "Fuji-san"
  - "Instagram"
  - "Follower"
turns:
  - turn: 1
    speaker: A
    script_text: "はじめまして、田中と申します。よろしくお願いします。"
    expected_translation: "Freut mich, ich heiße Tanaka. Ich freue mich auf die Zusammenarbeit."
    eval_point: "謙譲表現の自然なドイツ語化"
  - turn: 2
    speaker: B
    script_text: "Hallo! Ich bin Hans, ich rufe aus Berlin an. Ebenfalls schön, Sie kennenzulernen."
    expected_translation: "こんにちは！ベルリンからかけているハンスです。こちらこそよろしくお願いします。"
    eval_point: "固有名詞 (Berlin, Hans) の保持"
  - turn: 3
    speaker: A
    script_text: "趣味は写真撮影です。特に風景写真が好きで、週末は山や海に行きます。"
    expected_translation: "Mein Hobby ist die Fotografie. Ich mag besonders Landschaftsfotos und fahre am Wochenende in die Berge oder ans Meer."
    eval_point: "複数趣味の正確な伝達・前置詞の格"
  - turn: 4
    speaker: B
    script_text: "Toll! Ich wandere auch gerne. Haben Sie berühmte Berge in Japan besucht?"
    expected_translation: "素晴らしいですね！私もハイキングが好きです。日本の有名な山に行ったことはありますか？"
    eval_point: "疑問文の翻訳・Perfekt 形"
  - turn: 5
    speaker: A
    script_text: "はい、富士山に3回登ったことがあります。とても達成感がありました。"
    expected_translation: "Ja, ich bin dreimal auf den Fuji-san geklettert. Es war sehr befriedigend."
    eval_point: "固有名詞 (Fuji-san) + 回数 + Perfekt"
  - turn: 6
    speaker: B
    script_text: "Wow, dreimal! Was war der einprägsamste Teil?"
    expected_translation: "すごい、3回も！一番印象に残った部分は何ですか？"
    eval_point: "感嘆・疑問の組み合わせ"
  - turn: 7
    speaker: A
    script_text: "山頂での日の出が最高でした。空が赤やオレンジに染まって、言葉にならないほど美しかったです。"
    expected_translation: "Der Sonnenaufgang am Gipfel war wunderschön. Der Himmel wurde rot und orange gefärbt – so schön, dass mir die Worte fehlen."
    eval_point: "情景描写・Passiv 形・複合語"
  - turn: 8
    speaker: B
    script_text: "Das kann ich mir vorstellen. Teilen Sie Ihre Fotos online?"
    expected_translation: "想像できます。写真をオンラインで公開していますか？"
    eval_point: "文脈保持"
  - turn: 9
    speaker: A
    script_text: "はい、Instagramに投稿しています。フォロワーが最近1000人を超えました。"
    expected_translation: "Ja, ich poste auf Instagram. Meine Follower haben kürzlich 1.000 überschritten."
    eval_point: "SNS 固有名詞 + 数値 (ドイツ式千区切り)"
  - turn: 10
    speaker: B
    script_text: "Beeindruckend! Ich folge Ihnen auf jeden Fall. Bleiben wir in Kontakt."
    expected_translation: "それはすごい！フォローしますね。またご連絡しましょう。"
    eval_point: "締めくくり表現"
