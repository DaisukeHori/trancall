appId: tech.hori.trancall
name: "SCR-006 — Settings screen - sign out"
tags: [P0, settings]
---
# NOTE: the original flow also tapped "settings-nativeLanguage-row" and
# expected a language picker (assertVisible "Japanese" → tapOn "English").
# apps/mobile/src/screens/settings-screen.tsx's nativeLanguage SettingsRow has
# no onPress at all today (chevron-only, inert) — there is no language picker
# screen wired into SettingsStack (apps/mobile/src/navigation/settings-stack.tsx).
# That's a product gap, not a Maestro/testID issue, so it's out of scope here.
# Trimmed to the part that is real: opening Settings and signing out. Restore
# the language-switch steps once that screen exists.
- launchApp:
    clearState: true
- runFlow: shared/login_as_e2e_user.yaml
- tapOn:
    id: "tab-settings"
- assertVisible:
    text: ${T_settings_title}
- tapOn:
    text: ${T_settings_danger_signOut}
- tapOn:
    text: ${T_settings_danger_signOut}
- assertVisible:
    text: ${T_auth_signIn}
