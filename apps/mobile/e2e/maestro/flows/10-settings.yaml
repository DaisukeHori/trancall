appId: tech.hori.trancall
name: "SCR-006 — Settings screen: nativeLanguage change + signOut"
tags: [P0, settings]
---
- launchApp:
    clearState: true
- runFlow: shared/login_as_e2e_user.yaml
- tapOn:
    id: "tab-settings"
- assertVisible:
    text: ${T_settings_title}
- tapOn:
    id: "settings-nativeLanguage-row"
- assertVisible:
    text: "Japanese"
- tapOn:
    text: "English"
- assertVisible:
    text: ${T_settings_title}
- tapOn:
    text: ${T_settings_danger_signOut}
- tapOn:
    text: ${T_common_confirm}
- assertVisible:
    text: ${T_auth_signIn}
