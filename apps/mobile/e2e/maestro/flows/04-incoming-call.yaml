appId: tech.hori.trancall
name: "SCR-004 — trigger-incoming-call → Incoming screen → Accept → InCall"
tags: [P0, call]
---
- launchApp:
    clearState: true
- runFlow: shared/login_as_e2e_user.yaml
- runScript:
    file: ../../scripts/trigger-incoming-call.js
- assertVisible:
    text: ${T_call_incomingCall}
- assertVisible:
    text: ${T_call_accept}
- assertVisible:
    text: ${T_call_decline}
- tapOn:
    text: ${T_call_accept}
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    text: ${T_call_inCall}
- assertVisible:
    accessibilityLabel: ${T_call_endCall}
- tapOn:
    accessibilityLabel: ${T_call_endCall}
- assertVisible:
    text: ${T_callSummary_viewTranscript}
