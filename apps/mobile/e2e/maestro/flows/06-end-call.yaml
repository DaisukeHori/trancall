appId: tech.hori.trancall
name: "SCR-009 — Pre-call → translation ON → start → Calling → InCall → End"
tags: [P0, call]
---
- launchApp:
    clearState: true
- runFlow: shared/login_as_e2e_user.yaml
- tapOn:
    id: "tab-contacts"
- tapOn:
    id: "contact-row-${E2E_PEER_TRANCALL_ID}"
- tapOn:
    text: ${T_contactProfile_call}
- assertVisible:
    text: ${T_precall_title}
- assertVisible:
    text: ${T_translation_enabled}
- assertVisible:
    text: ${T_precall_remainingMinutes}
- tapOn:
    id: "translation-toggle"
- tapOn:
    accessibilityLabel: ${T_call_startCall}
- assertVisible:
    text: ${T_call_calling}
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    text: ${T_call_inCall}
- assertVisible:
    accessibilityLabel: ${T_call_endCall}
- tapOn:
    accessibilityLabel: ${T_call_endCall}
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    text: ${T_callSummary_viewTranscript}
