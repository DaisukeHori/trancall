appId: tech.hori.trancall
name: "SCR-009 — Pre-call → translation ON → start → Calling → InCall → End"
# Demoted from P0: same root cause as 05-in-call.yaml — an outgoing call never
# auto-transitions from Calling to InCall (Phase 2 signaling gap, see
# apps/mobile/src/screens/calling-screen.tsx's stub effect). Left in P2 until
# that's wired; testID plumbing (call-end-button etc.) is already in place.
tags: [P2, call]
---
- launchApp:
    clearState: true
- runFlow: shared/login_as_e2e_user.yaml
- tapOn:
    id: "tab-contacts"
- tapOn:
    id: "contact-row-${E2E_PEER_TRANCALL_ID}"
- tapOn:
    text: ${T_contactProfile_call}
- assertVisible:
    text: ${T_precall_title}
- assertVisible:
    text: ${T_translation_enabled}
- assertVisible:
    text: ${T_precall_remainingMinutes}
- tapOn:
    id: "translation-toggle"
- tapOn:
    text: ${T_call_startCall}
- assertVisible:
    text: ${T_call_calling}
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    text: ${T_call_inCall}
- assertVisible:
    text: ${T_call_endCall}
- tapOn:
    id: "call-end-button"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    text: ${T_callSummary_viewTranscript}
