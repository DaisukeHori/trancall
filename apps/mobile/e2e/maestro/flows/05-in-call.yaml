appId: tech.hori.trancall
name: "SCR-003 — InCall controls: mute / speaker / translation toggle / subtitles"
# Demoted from P0: reaching "In Call" here requires the OUTGOING call
# (PreCall → Calling) to auto-transition to InCall once "answered". That
# transition doesn't exist yet — apps/mobile/src/screens/calling-screen.tsx's
# only effect is an explicit stub ("TODO Phase 2: subscribe to signaling
# event for callee answer"; cleanup-only, no polling/listener), and
# apps/mobile/src/screens/incoming-call-screen.tsx's navigation.replace("InCall", ...)
# is the ONLY call site that ever navigates to InCall — it only fires for the
# callee accepting an incoming call (see 04-incoming-call.yaml), not for the
# caller here. So this flow will hang on "Calling..." past this point. Not a
# Maestro/testID issue — it's the Phase 2 signaling integration gap. Left in
# P2 until that lands; the mute/end-call/translation-toggle testIDs added in
# apps/mobile/src/screens/in-call-screen.tsx are already in place for when it does.
tags: [P2, call]
---
- launchApp:
    clearState: true
- runFlow: shared/login_as_e2e_user.yaml
- tapOn:
    id: "tab-contacts"
- tapOn:
    id: "contact-row-${E2E_PEER_TRANCALL_ID}"
- tapOn:
    text: ${T_contactProfile_call}
- assertVisible:
    text: ${T_precall_title}
- assertVisible:
    text: ${T_translation_enabled}
- tapOn:
    text: ${T_call_startCall}
- assertVisible:
    text: ${T_call_calling}
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    text: ${T_call_inCall}
- tapOn:
    id: "call-mute-button"
- assertVisible:
    text: "Unmute"
- tapOn:
    id: "call-mute-button"
- tapOn:
    id: "translation-toggle"
- assertVisible:
    text: ${T_translation_disabled}
- tapOn:
    id: "translation-toggle"
- assertVisible:
    text: ${T_translation_enabled}
- assertVisible:
    text: ${T_call_endCall}
