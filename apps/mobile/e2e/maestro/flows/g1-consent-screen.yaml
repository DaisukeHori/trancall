appId: tech.hori.trancall
name: "gate_consent_caller — Translation consent (caller side)"
# Demoted from P0: this flow's premise (a consent gate shown before the
# first call) never fires today. ConsentScreen + the consent-store redirect
# machinery are fully built, but the trigger — handleConsentError() in
# apps/mobile/src/lib/consent-interceptor.ts — is never called from any API
# call site (contact-profile-screen.tsx's handleCall / pre-call-screen.tsx's
# handleCall go straight to PreCall/createCall with no consent check, and
# apps/mock-server/src/routes/rooms.ts never returns AUTH_CONSENT_REQUIRED).
# So tapping "Call" here lands on PreCall directly, not this screen. Left in
# P2 (not run in the P0 CI gate) so the flow is ready to re-promote once the
# consent gate is actually wired to a call-creation entry point. The
# testID plumbing referenced below (consent-*-checkbox) is already in place
# in apps/mobile/src/screens/consent-screen.tsx.
tags: [P2, gate, consent]
---
- launchApp:
    clearState: true
- runFlow: shared/login_as_e2e_user.yaml
- tapOn:
    id: "tab-contacts"
- tapOn:
    id: "contact-row-${E2E_PEER_TRANCALL_ID}"
- tapOn:
    text: ${T_contactProfile_call}
- assertVisible:
    text: ${T_consent_agree}
- tapOn:
    id: "consent-voice-to-openai-checkbox"
- tapOn:
    id: "consent-transcript-retention-checkbox"
- tapOn:
    text: ${T_consent_agree}
- assertVisible:
    text: ${T_precall_title}
