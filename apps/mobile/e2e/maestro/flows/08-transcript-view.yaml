appId: tech.hori.trancall
name: "SCR-011 + SCR-012 — Call summary → View Full Transcript"
# Demoted from P0: same root cause as 05-in-call.yaml — an outgoing call never
# auto-transitions from Calling to InCall (Phase 2 signaling gap, see
# apps/mobile/src/screens/calling-screen.tsx's stub effect), so this flow
# never reaches T_call_inCall / the End Call button that gets it to
# CallSummary. Left in P2 until that's wired.
tags: [P2, transcript]
---
- launchApp:
    clearState: true
- runFlow: shared/login_as_e2e_user.yaml
- tapOn:
    id: "tab-contacts"
- tapOn:
    id: "contact-row-${E2E_PEER_TRANCALL_ID}"
- tapOn:
    text: ${T_contactProfile_call}
- tapOn:
    text: ${T_call_startCall}
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    text: ${T_call_inCall}
- tapOn:
    id: "call-end-button"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    text: ${T_callSummary_viewTranscript}
- tapOn:
    text: ${T_callSummary_viewTranscript}
- assertVisible:
    text: ${T_transcript_export_button}
