appId: tech.hori.trancall
name: "gate_mic_permission — First call mic permission gate"
# Demoted from P0: two compounding issues. (1) The mic permission check
# doesn't happen at PreCall's "Start Call" tap — it happens later, inside
# apps/mobile/src/screens/in-call-screen.tsx's connectToRoom() effect
# (MicrophonePermissionDeniedError → usePermissionStore.setDeniedPermission),
# which only runs once InCallScreen mounts. (2) InCallScreen is never reached
# for an outgoing call at all today — same Phase 2 signaling gap documented in
# 05-in-call.yaml (apps/mobile/src/screens/calling-screen.tsx's stub effect).
# So this flow's ordering doesn't match the app even once signaling lands;
# needs to be rewritten to assert the permission screen after InCall mounts,
# not right after tapping Start Call. Left in P2.
tags: [P2, gate, permission]
---
- launchApp:
    clearState: true
- runFlow: shared/login_as_e2e_user.yaml
- tapOn:
    id: "tab-contacts"
- tapOn:
    id: "contact-row-${E2E_PEER_TRANCALL_ID}"
- tapOn:
    text: ${T_contactProfile_call}
- assertVisible:
    text: ${T_precall_title}
- tapOn:
    text: ${T_call_startCall}
- assertVisible:
    text: ${T_permissions_microphoneTitle}
- tapOn:
    text: "Allow"
- assertVisible:
    text: ${T_call_calling}
