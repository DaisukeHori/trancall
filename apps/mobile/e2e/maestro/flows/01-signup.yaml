appId: tech.hori.trancall
name: "auth_signup — Sign up → Home"
tags: [P0, auth]
---
# NOTE: the original version of this flow asserted a Consent screen step
# (T_consent_agree) right after signup. That never fires today: the
# consent-interceptor (apps/mobile/src/lib/consent-interceptor.ts
# handleConsentError) that would redirect to ConsentScreen is fully built but
# never called from signup-screen.tsx / auth-store.ts, so nothing ever
# triggers requestConsentRedirect() on this path. Signup goes straight to
# Home once the request succeeds. Trimmed to match actual behavior — restore
# the consent step once that wiring lands.
- launchApp:
    clearState: true
- assertVisible:
    text: ${T_onboarding_poweredBy}
- tapOn:
    text: ${T_common_next}
- tapOn:
    text: ${T_auth_signUp}
- tapOn:
    id: "displayName-input"
- inputText: "E2E User A"
- tapOn:
    text: ${T_auth_email}
- inputText: ${E2E_SIGNUP_EMAIL}
- tapOn:
    id: "password-input"
- inputText: ${E2E_USER_A_PASSWORD}
- tapOn:
    id: "consent-checkbox"
- assertVisible:
    text: ${T_auth_consent_checkboxLabel}
- tapOn:
    text: ${T_auth_signUp}
- assertVisible:
    text: ${T_home_recentCalls}
