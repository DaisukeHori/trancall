# 【重要】ここに env: ブロックを書いても Maestro には適用されない。
# Maestro のワークスペース設定ファイル (config.yaml) はトップレベルの `env:` を
# サポートしていない (公式リファレンス https://docs.maestro.dev/reference/workspace-configuration
# に env プロパティの記載なし、実測でも全P0フローが `${T_xxx}` を解決できず
# "Element not found: Text matching regex: undefined" で 8/8 失敗することを
# PR #75 CI で確認済み)。実際に変数を全フローへ適用する唯一の公式手段は
# `maestro test` の `-e KEY=VALUE` フラグ (--env の繰り返し指定) のみ。
#
# 変数の正本は apps/mobile/e2e/maestro/env.json。
# `-e` 引数列は apps/mobile/e2e/print-maestro-env-args.js で生成する
# (.github/workflows/e2e.yml のios/androidジョブが使用)。
# ローカルで単一フローを手動実行する場合も、この生成スクリプトの出力を
# `maestro test <flow>.yaml $(node apps/mobile/e2e/print-maestro-env-args.js)`
# のように渡すこと。
