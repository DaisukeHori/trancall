*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;padding:20px;color:#1a1a1a}

.divider{height:1px;background:#f0f0f0;margin:8px 0}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stat{background:#f5f5f5;border-radius:8px;padding:10px}
.stat-label{font-size:11px;color:#888;margin:0}
.stat-value{font-size:16px;font-weight:500;margin:2px 0 0}

.pill{display:inline-block;padding:4px 10px;border-radius:12px;font-size:11px;border:1px solid #ddd;margin:2px}
.pill.active{background:#e6f1fb;color:#185fa5;border-color:transparent}
