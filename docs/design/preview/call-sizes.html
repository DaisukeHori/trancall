<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#1C1C1E;font-family:var(--tc-font-sans);color:#F5F5F5}
.w{padding:22px;display:flex;align-items:center;gap:22px;justify-content:center}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border-radius:9999px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.a{width:56px;height:56px;background:#34C759;font-size:24px}
.d{width:56px;height:56px;background:#FF3B30;font-size:24px}
.c{width:48px;height:48px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);font-size:18px;color:#F5F5F5}
.lab{font-family:var(--tc-font-mono);font-size:11px;font-weight:600}
.val{font-family:var(--tc-font-mono);font-size:10px;color:#8E8E93}
</style></head><body><div class="w">
  <div class="cell"><div class="btn a">✓</div><div class="lab">actionSize</div><div class="val">56 · accept</div></div>
  <div class="cell"><div class="btn d">✕</div><div class="lab">actionSize</div><div class="val">56 · decline</div></div>
  <div class="cell"><div class="btn c">🔇</div><div class="lab">controlSize</div><div class="val">48 · mute</div></div>
  <div class="cell"><div class="btn c">🔈</div><div class="lab">controlSize</div><div class="val">48 · speaker</div></div>
  <div class="cell" style="margin-left:14px;align-items:flex-start;text-align:left;border-left:1px solid #38383A;padding-left:22px">
    <div class="lab" style="font-size:12px">min hit target</div>
    <div class="val">44 × 44 (iOS HIG)</div>
  </div>
</div></body></html>
