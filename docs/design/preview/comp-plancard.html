<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#fafafa;font-family:var(--tc-font-sans);color:#1A1A1A}
.w{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{padding:16px;border-radius:12px;background:#fff;border:1px solid #E5E5EA;min-height:80px}
.sel{border:2px solid #0A7AFF;background:#E6F1FB}
.row{display:flex;justify-content:space-between;align-items:center}
.name{font-size:18px;font-weight:600}
.tick{width:24px;height:24px;border-radius:9999px;background:#0A7AFF;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.price{font-size:24px;font-weight:700;color:#0A7AFF;margin-top:4px}
.suffix{font-size:14px;font-weight:400;color:#8E8E93;margin-left:2px}
.min{font-size:13px;color:#8E8E93;margin-top:4px}
</style></head><body><div class="w">
  <div class="card">
    <div class="row"><span class="name">Free</span></div>
    <div class="price">¥0<span class="suffix">/月</span></div>
    <div class="min">10分 含む</div>
  </div>
  <div class="card sel">
    <div class="row"><span class="name">Standard</span><span class="tick">✓</span></div>
    <div class="price">¥1,480<span class="suffix">/月</span></div>
    <div class="min">300分 含む</div>
  </div>
</div></body></html>
