<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#fff;font-family:var(--tc-font-sans)}
.w{padding:24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.b{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:9999px;font-size:12px;font-weight:500}
.dot{width:6px;height:6px;border-radius:50%}
.default{background:#E6F1FB;color:#0A7AFF}.default .dot{background:#0A7AFF}
.success{background:#EAF3DE;color:#34C759}.success .dot{background:#34C759}
.warning{background:#FAEEDA;color:#FF9500}.warning .dot{background:#FF9500}
.danger{background:#FCEBEB;color:#FF3B30}.danger .dot{background:#FF3B30}
</style></head><body><div class="w">
  <span class="b default"><span class="dot"></span>翻訳ON</span>
  <span class="b success"><span class="dot"></span>Translating</span>
  <span class="b warning"><span class="dot"></span>Reconnecting</span>
  <span class="b danger"><span class="dot"></span>Stopped</span>
  <span class="b default">JA → EN</span>
  <span class="b success">残り 248 分</span>
  <span class="b warning">残り 12 分</span>
  <span class="b danger">不在着信</span>
</div></body></html>
