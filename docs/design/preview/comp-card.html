<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#fafafa;font-family:var(--tc-font-sans)}
.w{padding:22px}
.card{background:#fff;border:1px solid #E5E5EA;border-radius:12px;padding:16px;box-shadow:0 2px 4px rgba(0,0,0,.08)}
.t{font-size:16px;font-weight:600;color:#1A1A1A;margin:0 0 6px}
.p{font-size:14px;color:#8E8E93;line-height:1.5;margin:0}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:9999px;font-size:12px;font-weight:500;background:#EAF3DE;color:#34C759}
.dot{width:6px;height:6px;border-radius:50%;background:#34C759}
.btn{font-size:14px;font-weight:600;color:#0A7AFF;background:none;border:0;cursor:pointer}
</style></head><body><div class="w">
  <div class="card">
    <h3 class="t">通話設定</h3>
    <p class="p">JA → EN · リアルタイム字幕がオン · 約12円/分の見積もり</p>
    <div class="row"><span class="badge"><span class="dot"></span>翻訳ON</span><button class="btn">変更</button></div>
  </div>
</div></body></html>
