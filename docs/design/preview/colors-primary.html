<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fafafa;font-family:var(--tc-font-sans)}
  .card{padding:20px 22px;background:#fff;display:flex;gap:14px}
  .swatch{flex:1;border-radius:var(--tc-radius-12);border:1px solid var(--tc-border);overflow:hidden;display:flex;flex-direction:column}
  .hd{padding:18px 16px;display:flex;align-items:center;justify-content:space-between;color:#fff}
  .hd b{font-size:18px;font-weight:700;letter-spacing:-.01em}
  .hd code{font-size:11px;font-weight:500;opacity:.85;font-family:var(--tc-font-mono)}
  .ft{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--tc-text-secondary);font-family:var(--tc-font-mono)}
  .ft .dot{width:16px;height:16px;border-radius:50%;border:1px solid var(--tc-border)}
  .tag{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--tc-text-secondary);margin-bottom:8px}
</style></head><body>
<div class="card">
  <div style="flex:1">
    <div class="tag">Light · primary</div>
    <div class="swatch">
      <div class="hd" style="background:#0A7AFF"><b>Primary</b><code>#0A7AFF</code></div>
      <div class="ft"><span>primaryBg</span><span class="dot" style="background:#E6F1FB"></span><code>#E6F1FB</code></div>
    </div>
  </div>
  <div style="flex:1">
    <div class="tag">Dark · primary</div>
    <div class="swatch">
      <div class="hd" style="background:#64B5F6"><b>Primary</b><code>#64B5F6</code></div>
      <div class="ft" style="background:#1C1C1E;color:#8E8E93;border-top:1px solid #38383A"><span>primaryBg</span><span class="dot" style="background:#0C447C;border-color:#38383A"></span><code>#0C447C</code></div>
    </div>
  </div>
</div></body></html>
