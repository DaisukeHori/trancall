<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#fff;font-family:var(--tc-font-sans)}
.w{padding:22px;display:flex;align-items:flex-end;gap:24px;justify-content:center}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px}
.av{background:#E6F1FB;color:#0A7AFF;font-weight:600;display:flex;align-items:center;justify-content:center;border-radius:9999px}
.sm{width:32px;height:32px;font-size:12px}
.md{width:40px;height:40px;font-size:16px}
.lg{width:56px;height:56px;font-size:22px}
.xl{width:80px;height:80px;font-size:32px}
.lab{font-family:var(--tc-font-mono);font-size:11px;color:#8E8E93}
.stack{display:flex}
.stack .av{border:2px solid #fff}
.stack .av+.av{margin-left:-8px}
</style></head><body><div class="w">
  <div class="cell"><div class="av sm">DH</div><div class="lab">sm · 32</div></div>
  <div class="cell"><div class="av md">DH</div><div class="lab">md · 40</div></div>
  <div class="cell"><div class="av lg">DH</div><div class="lab">lg · 56</div></div>
  <div class="cell"><div class="av xl">DH</div><div class="lab">xl · 80</div></div>
  <div class="cell"><div class="stack"><div class="av sm">DH</div><div class="av sm" style="background:#FAEEDA;color:#FF9500">YM</div><div class="av sm" style="background:#EAF3DE;color:#34C759">+5</div></div><div class="lab">AvatarStack</div></div>
</div></body></html>
