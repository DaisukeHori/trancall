<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#fff;font-family:var(--tc-font-sans)}
.w{padding:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;font-weight:600;min-height:44px;padding:12px 16px;border-radius:8px;border:0;cursor:pointer}
.primary{background:#0A7AFF;color:#fff}
.secondary{background:#F5F5F5;color:#1A1A1A}
.danger{background:#FF3B30;color:#fff}
.ghost{background:transparent;color:#0A7AFF;border:1px solid #0A7AFF}
.disabled{opacity:.5}
.lab{grid-column:1/-1;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:#8E8E93;margin-top:4px}
</style></head><body><div class="w">
  <div class="lab">Variant</div>
  <button class="btn primary">通話を開始</button>
  <button class="btn secondary">キャンセル</button>
  <button class="btn danger">通話を終了</button>
  <button class="btn ghost">あとで</button>
  <div class="lab">Size · sm / md / lg</div>
  <button class="btn primary" style="min-height:36px;padding:8px 12px;font-size:14px">Small</button>
  <button class="btn primary">Medium</button>
  <button class="btn primary" style="min-height:52px;padding:16px 24px;font-size:18px">Large</button>
  <button class="btn primary disabled">Disabled</button>
</div></body></html>
