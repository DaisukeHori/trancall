<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#1C1C1E;font-family:var(--tc-font-sans)}
.w{padding:22px}
.ov{background:rgba(0,0,0,0.85);border-radius:8px;padding:12px 14px;color:#fff}
.seg{margin-bottom:8px}
.seg:last-child{margin-bottom:0}
.orig{font-size:13px;color:#AAA;line-height:1.5;margin-bottom:2px}
.tr{font-size:15px;color:#fff;line-height:1.45}
.partial{text-decoration:underline dashed;text-underline-offset:3px;opacity:.75}
</style></head><body><div class="w">
  <div class="ov">
    <div class="seg"><div class="orig">明日の会議は10時からです。</div><div class="tr">Tomorrow's meeting starts at 10.</div></div>
    <div class="seg"><div class="orig">場所は本社の3階会議室で。</div><div class="tr">The location is the 3F conference room at HQ.</div></div>
    <div class="seg"><div class="orig">資料は事前に共有しますね</div><div class="tr partial">I'll share the materials beforehand</div></div>
  </div>
</div></body></html>
