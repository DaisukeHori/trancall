<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#fff;font-family:var(--tc-font-sans)}
.w{padding:22px;display:flex;align-items:center;gap:20px;justify-content:space-around}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px}
.shape{width:72px;height:56px;background:linear-gradient(135deg,#0A7AFF,#64B5F6);border:1px solid rgba(0,0,0,.06)}
.lab{font-family:var(--tc-font-mono);font-size:11px;color:#1A1A1A;font-weight:600}
.val{font-family:var(--tc-font-mono);font-size:10px;color:#8E8E93}
.dot{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#0A7AFF,#64B5F6)}
</style></head><body><div class="w">
  <div class="cell"><div class="shape" style="border-radius:4px"></div><div class="lab">radius-4</div><div class="val">4px</div></div>
  <div class="cell"><div class="shape" style="border-radius:8px"></div><div class="lab">radius-8</div><div class="val">8 · buttons</div></div>
  <div class="cell"><div class="shape" style="border-radius:12px"></div><div class="lab">radius-12</div><div class="val">12 · cards</div></div>
  <div class="cell"><div class="shape" style="border-radius:16px"></div><div class="lab">radius-16</div><div class="val">16 · sheets</div></div>
  <div class="cell"><div class="dot"></div><div class="lab">radius-full</div><div class="val">9999 · avatar</div></div>
</div></body></html>
