<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#fff;font-family:var(--tc-font-sans);color:#1A1A1A}
.w{padding:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end}
.cell{border:1px solid #E5E5EA;border-radius:12px;padding:16px}
.lab{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8E8E93;font-weight:600;margin-bottom:6px}
.mono{font-family:var(--tc-font-mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.big{font-size:22px}
</style></head><body><div class="w">
  <div class="cell"><div class="lab">Duration</div><div class="mono big">02:34</div><div class="mono" style="color:#8E8E93;font-size:11px;margin-top:4px">tabular-nums</div></div>
  <div class="cell"><div class="lab">Cost</div><div class="mono big">¥128</div><div class="mono" style="color:#8E8E93;font-size:11px;margin-top:4px">mono · 14 / 500</div></div>
  <div class="cell"><div class="lab">TranCall ID</div><div class="mono big">@hori.dk</div><div class="mono" style="color:#8E8E93;font-size:11px;margin-top:4px">monospace fallback</div></div>
</div></body></html>
