<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#fff;font-family:var(--tc-font-sans)}
.w{padding:20px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;font-family:var(--tc-font-mono);font-size:12px;color:#1A1A1A}
.box{background:#0A7AFF;border-radius:4px;height:18px}
.lab{width:54px;font-weight:600;color:#1A1A1A}
.val{margin-left:auto;color:#8E8E93}
</style></head><body><div class="w">
  <div class="row"><span class="lab">space-4</span><div class="box" style="width:4px"></div><span class="val">4px · badge padding / icon→label</span></div>
  <div class="row"><span class="lab">space-8</span><div class="box" style="width:8px"></div><span class="val">8px · button radius unit</span></div>
  <div class="row"><span class="lab">space-12</span><div class="box" style="width:12px"></div><span class="val">12px · list row vertical padding</span></div>
  <div class="row"><span class="lab">space-16</span><div class="box" style="width:16px"></div><span class="val">16px · default card padding</span></div>
  <div class="row"><span class="lab">space-24</span><div class="box" style="width:24px"></div><span class="val">24px · section spacing</span></div>
  <div class="row"><span class="lab">space-32</span><div class="box" style="width:32px"></div><span class="val">32px · screen gutter</span></div>
  <div class="row"><span class="lab">space-48</span><div class="box" style="width:48px"></div><span class="val">48px · hero whitespace</span></div>
  <div class="row"><span class="lab">space-64</span><div class="box" style="width:64px"></div><span class="val">64px · onboarding margin</span></div>
</div></body></html>
