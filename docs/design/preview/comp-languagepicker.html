<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#fff;font-family:var(--tc-font-sans);color:#1A1A1A}
.w{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.label{font-size:14px;font-weight:500;color:#8E8E93;margin-bottom:6px}
.trig{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid #E5E5EA;border-radius:8px;min-height:44px;font-size:16px}
.caret{color:#8E8E93}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lc{display:flex;flex-direction:column;align-items:center;padding:8px 4px;border-radius:8px;border:1px solid #E5E5EA;font-size:11px;color:#8E8E93}
.lc.sel{background:#E6F1FB;border-color:#0A7AFF;color:#0A7AFF;font-weight:600}
.flag{font-size:20px;line-height:1;margin-bottom:4px}
</style></head><body><div class="w">
  <div>
    <div class="label">母国語</div>
    <div class="trig"><span>🇯🇵 日本語</span><span class="caret">▾</span></div>
  </div>
  <div>
    <div class="label">Translate to</div>
    <div class="grid">
      <div class="lc"><span class="flag">🇺🇸</span>EN</div>
      <div class="lc sel"><span class="flag">🇯🇵</span>JA</div>
      <div class="lc"><span class="flag">🇨🇳</span>ZH</div>
      <div class="lc"><span class="flag">🇰🇷</span>KO</div>
      <div class="lc"><span class="flag">🇪🇸</span>ES</div>
      <div class="lc"><span class="flag">🇫🇷</span>FR</div>
      <div class="lc"><span class="flag">🇩🇪</span>DE</div>
      <div class="lc"><span class="flag">🇮🇹</span>IT</div>
    </div>
  </div>
</div></body></html>
