name: E2E (Maestro)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "apps/mock-server/**"
      - "packages/ui-kit/**"
      - ".github/workflows/e2e.yml"

jobs:
  ios:
    # React Native 0.81 は Xcode >= 16.1 を要求する。macos-14 ランナーの既定 Xcode は 15.4 のため
    # macos-15 (既定 Xcode 16.x) を使用する (PR #75 CI実測: macos-14 で "React Native requires
    # XCode >= 16.1. Found 15.4." により Podfile 評価が失敗することを確認)。
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck mock-server
        run: pnpm --filter @trancall/mock-server typecheck

      - name: Build mock-server
        run: pnpm --filter @trancall/mock-server build

      - name: Start mock-server
        run: pnpm --filter @trancall/mock-server start &
        env:
          PORT: 4010

      - name: Wait for mock-server
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:4010/health; then
              echo "mock-server ready"
              break
            fi
            echo "Waiting for mock-server... attempt $i"
            sleep 2
          done

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot iOS Simulator
        # デバイスタイプ/ランタイムをハードコードすると、ランナーのXcodeバージョンが変わる
        # (macos-14→macos-15でiOS-17-0ランタイムが存在せずsimctl createが失敗、PR #75で実測)
        # たびに壊れる。既存の事前作成済みiPhoneシミュレータを優先し、無ければランナー上で
        # 実際に利用可能な最新iOSランタイム+iPhoneデバイスタイプを動的に検出して作成する。
        run: |
          DEVICE_UDID=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries[] | .value[] | select(.name | test("iPhone")) | .udid' | head -1)
          if [ -z "$DEVICE_UDID" ]; then
            RUNTIME_ID=$(xcrun simctl list runtimes available -j | jq -r '[.runtimes[] | select(.identifier | contains("iOS"))] | last | .identifier')
            DEVICETYPE_ID=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | test("iPhone"))] | last | .identifier')
            echo "No pre-existing iPhone simulator found; creating from runtime=$RUNTIME_ID deviceType=$DEVICETYPE_ID"
            DEVICE_UDID=$(xcrun simctl create "TranCall E2E" "$DEVICETYPE_ID" "$RUNTIME_ID")
          fi
          xcrun simctl boot "$DEVICE_UDID" || true
          echo "SIMULATOR_UDID=$DEVICE_UDID" >> "$GITHUB_ENV"

      - name: Prebuild native iOS project
        run: pnpm --filter @trancall/app-mobile exec expo prebuild --platform ios --no-install
        env:
          EXPO_PUBLIC_API_BASE_URL: http://localhost:4010
          EXPO_PUBLIC_E2E_TEST_MODE: "true"
          NODE_ENV: test

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: apps/mobile/ios

      - name: Build Expo app for E2E (iOS Simulator, unsigned debug)
        run: |
          set -euo pipefail
          cd apps/mobile/ios
          WORKSPACE=$(ls -d ./*.xcworkspace | head -1)
          # CocoaPods統合済みworkspaceの `xcodebuild -list` は個別podのschemeも
          # アルファベット順で列挙するため、先頭を単純に拾うと "boost" 等の無関係な
          # pod schemeが選ばれてしまう (PR #75 CI実測: 実際に boost が選ばれ、
          # BUILD SUCCEEDEDにもかかわらずTranCall.appが生成されなかった)。
          # app.json の name から実際のアプリschemeを直接特定する。
          APP_NAME=$(node -p "require('../app.json').expo.name")
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null | awk -v app="$APP_NAME" '/Schemes:/{flag=1; next} flag && $0==""{flag=0} flag { gsub(/^[ \t]+|[ \t]+$/, ""); if ($0==app) {print; exit} }')
          if [ -z "$SCHEME" ]; then
            echo "::error::Could not find Xcode scheme matching app name \"$APP_NAME\" in $WORKSPACE"
            xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null
            exit 1
          fi
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"
          # FORCE_BUNDLING=1: the RN "Bundle React Native code and images" build
          # phase script normally skips embedding the JS bundle for Debug builds
          # (it expects a live Metro dev server instead). CI has no Metro server
          # running, so without this the app would show a "Could not connect to
          # development server" screen instead of actually launching. This forces
          # the bundle to be embedded like a Release build while keeping Debug
          # configuration (and therefore no code signing requirement) otherwise.
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            FORCE_BUNDLING=1
        env:
          EXPO_PUBLIC_API_BASE_URL: http://localhost:4010
          EXPO_PUBLIC_E2E_TEST_MODE: "true"
          NODE_ENV: test

      - name: Install app on simulator
        run: |
          set -euo pipefail
          APP_PATH=$(find apps/mobile/ios/build -name "*.app" -path "*Debug-iphonesimulator*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found under apps/mobile/ios/build (Debug-iphonesimulator)"
            exit 1
          fi
          echo "Installing $APP_PATH"
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"

      - name: Run Maestro P0 flows
        run: |
          # config.yaml の env: はMaestroに適用されない (詳細はconfig.yaml内コメント参照)。
          # apps/mobile/e2e/maestro/env.json から -e フラグを生成して渡す。
          ENV_ARGS=$(node apps/mobile/e2e/print-maestro-env-args.js)
          eval maestro test apps/mobile/e2e/maestro/flows/ \
            --include-tags P0 \
            --config apps/mobile/e2e/maestro/config.yaml \
            --format junit \
            --output maestro-results.xml \
            "$ENV_ARGS"
        env:
          # PR #75 CI実測: "Maestro driver timed out during snapshot call with: Unable to
          # perform work on main run loop, process main thread busy for 30.0s" で最初のflow
          # だけで6分かけて失敗。CI Mac runner上でのDebugビルド(FORCE_BUNDLING=1でHermes
          # bytecodeを最適化なしで同期embed)初回起動が主犯と推測されるが、Maestro公式
          # ドキュメントで "main run loop occupied" シナリオへの対処として明示されている
          # 唯一のレバーが MAESTRO_DRIVER_STARTUP_TIMEOUT (デフォルト15秒) のため、
          # ドキュメント推奨値の180秒に引き上げる。
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000

      - name: Upload Maestro test results
        if: always()
        # スクリーンショットのファイル名はMaestroがフロー名から自動生成し、
        # コロン等のNTFS非対応文字が紛れ込むとartifactアップロードが失敗しjob全体を
        # 巻き込む (PR #75 CI実測)。デバッグ用の副次outputなので失敗してもjobを赤くしない。
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results-ios
          path: |
            maestro-results.xml
            ~/.maestro/tests/**/*.png
          retention-days: 7

      - name: Upload failure screenshots
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots-ios-failure
          path: ~/.maestro/tests/**/*.png
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted ubuntu ランナーは既定で /dev/kvm への書き込み権限が無く、
      # android-emulator-runner がハードウェア加速なしで起動しようとしてタイムアウトする
      # (PR #75 CI実測: "ProbeKVM: This user doesn't have permissions to use KVM" 後に
      # "Timeout waiting for emulator to boot")。reactivecircus/android-emulator-runner
      # の README 記載の標準的な有効化手順。
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # PR #75 CI実測: "No space left on device" でAndroidシステムイメージの準備が
      # 失敗しemulatorが起動できなかった (ubuntu-latestランナーの既定ディスク容量が
      # gradle/expo/monorepoの大きなnode_modulesビルドで逼迫する)。Androidビルドに
      # 不要な大型プリインストール済みツールチェーン (.NET/Haskell/Swift/CodeQL等) を
      # 削除して空き容量を確保する。Android SDK自体 (/usr/local/lib/android) は
      # 削除しない。
      - name: Free disk space
        run: |
          # NOTE: /usr/local/lib/android/sdk/ndk/* は実際にビルドで使われている
          # (expo-modules-core の CMake タスクで実測確認済み) ため削除しない。
          # Android/Node/Gradleに無関係な大型プリインストール済みツールチェーンのみ対象。
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            /usr/lib/jvm/temurin-8-jdk-amd64 /usr/lib/jvm/temurin-11-jdk-amd64 \
            /opt/az /usr/local/.ghcup || true
          df -h /

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mock-server
        run: pnpm --filter @trancall/mock-server build

      - name: Start mock-server
        run: |
          pnpm --filter @trancall/mock-server start &
        env:
          PORT: 4010

      - name: Wait for mock-server
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:4010/health; then
              echo "mock-server ready"
              break
            fi
            echo "Waiting for mock-server... attempt $i"
            sleep 2
          done

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate placeholder google-services.json (E2E build only)
        run: |
          set -euo pipefail
          # apps/mobile/plugins/with-android-native.js only wires
          # android.googleServicesFile when this file physically exists
          # (withConditionalGoogleServicesFile). Firebase Messaging is linked
          # into the native Android project (FcmService.kt) regardless, so a
          # debug `expo prebuild` + `gradlew assembleDebug` needs *some* valid
          # google-services.json to be present or the google-services Gradle
          # plugin / Firebase SDK init can fail. This is a placeholder built
          # from public, non-secret fields only (no real Firebase project),
          # generated here and never committed to the repo.
          cat > apps/mobile/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "trancall-e2e-placeholder",
              "storage_bucket": "trancall-e2e-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "tech.hori.trancall"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyE2EPlaceholderKeyNotReal00000000000" }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Prebuild native Android project
        run: pnpm --filter @trancall/app-mobile exec expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:4010
          EXPO_PUBLIC_E2E_TEST_MODE: "true"
          NODE_ENV: test
          # apps/mobile/plugins/with-android-native.js の withE2eDebugBundling を有効化する。
          # React Native Gradle Plugin は react{} ブロックの debuggableVariants (既定 ['debug'])
          # に含まれる variant のバンドル/アセット埋め込みタスクを丸ごとスキップし、Metro dev
          # server への接続を前提とする (node_modules/@react-native/gradle-plugin の
          # TaskConfiguration.kt で実ソース確認済み)。以前ここで使っていた `-PbundleInDebug=true`
          # という Gradle project property は RNGP のどのバージョンにも存在しない架空のフラグ
          # だった (grep で参照ゼロ、CI実測で "Unable to load script" の RN redbox が出て発覚)。
          # 正しいレバーは debuggableVariants を空配列にすることで、これは prebuild 時に
          # config plugin で build.gradle に注入する必要がある (Gradle 実行時の -P では遅い)。
          TRANCALL_E2E_BUNDLE_DEBUG: "1"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/mobile/android
        env:
          # このステップが実際にMetroでJSバンドルを生成する場所 (前段のPrebuildステップの
          # env: はGradleのbundleDebugJsAndAssetsタスクには引き継がれない、各stepのenv:は
          # そのstepのみ有効なため個別に必要)。EXPO_PUBLIC_E2E_TEST_MODEが無いとE2E専用
          # モックログイン (apps/mobile/src/api/auth-api.ts isE2eTestMode) が発火せず、
          # 全フローがログイン画面で "Email" テキストを見つけられず失敗する
          # (PR #75 CI実測)。
          EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:4010
          EXPO_PUBLIC_E2E_TEST_MODE: "true"
          NODE_ENV: test

      - name: Locate debug APK
        run: |
          set -euo pipefail
          APK_PATH=$(find apps/mobile/android -name "*.apk" -path "*debug*" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No debug APK found under apps/mobile/android"
            exit 1
          fi
          echo "APK_PATH=$GITHUB_WORKSPACE/$APK_PATH" >> "$GITHUB_ENV"

      - name: Run Maestro P0 flows (Android Emulator)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # iOSと同じ理由でCI Mac/Linux runner上でのアプリ初回起動が遅い場合に備え、
          # デフォルト15秒よりゆとりを持たせる (詳細はiOS job の同名env var コメント参照)。
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # reactivecircus/android-emulator-runner の `script:` は複数行を1つの
          # シェルセッションとして実行せず、各行を個別の `sh -c` プロセスとして
          # 実行する (PR #75 CI実測: ログに `[command]/usr/bin/sh -c ENV_ARGS=$(...)`
          # と `[command]/usr/bin/sh -c eval maestro test ...` が別々の [command] として
          # 記録され、2行目で $ENV_ARGS が空になり env未解決のまま実行→ハング→30分
          # タイムアウトになることを確認)。バックスラッシュ改行継続も同様に壊れる
          # (別途実測済み)。状態を共有する必要のあるコマンド列は `&&` で1行に
          # 結合し、同一 sh -c プロセス内で完結させる。
          # logcat をクリアしてから実行し、テスト後に全バッファをファイルへdumpする
          # (成功/失敗に関わらず `;` で必ず実行。JS実行時の実際の例外はMaestroの
          # スクリーンショット/レポートには現れず、logcatのReactNativeJSタグにのみ
          # 出力されるため、原因診断にはこれが必須)。
          script: |
            adb logcat -c
            adb install -r "$APK_PATH"
            ENV_ARGS=$(node "$GITHUB_WORKSPACE/apps/mobile/e2e/print-maestro-env-args.js") && eval maestro test "$GITHUB_WORKSPACE/apps/mobile/e2e/maestro/flows/" --include-tags P0 --config "$GITHUB_WORKSPACE/apps/mobile/e2e/maestro/config.yaml" --format junit --output "$GITHUB_WORKSPACE/maestro-results-android.xml" "$ENV_ARGS" ; adb logcat -d > "$GITHUB_WORKSPACE/android-logcat.txt" ; true

      - name: Upload logcat
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-logcat
          path: android-logcat.txt
          retention-days: 7

      - name: Upload Maestro test results
        if: always()
        # スクリーンショットのファイル名はMaestroがフロー名から自動生成し、
        # コロン等のNTFS非対応文字が紛れ込むとartifactアップロードが失敗しjob全体を
        # 巻き込む (PR #75 CI実測)。デバッグ用の副次outputなので失敗してもjobを赤くしない。
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results-android
          path: |
            maestro-results-android.xml
            ~/.maestro/tests/**/*.png
          retention-days: 7

      - name: Upload failure screenshots
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots-android-failure
          path: ~/.maestro/tests/**/*.png
          retention-days: 7
