name: E2E (Maestro)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "apps/mock-server/**"
      - "packages/ui-kit/**"
      - ".github/workflows/e2e.yml"

jobs:
  ios:
    # React Native 0.81 は Xcode >= 16.1 を要求する。macos-14 ランナーの既定 Xcode は 15.4 のため
    # macos-15 (既定 Xcode 16.x) を使用する (PR #75 CI実測: macos-14 で "React Native requires
    # XCode >= 16.1. Found 15.4." により Podfile 評価が失敗することを確認)。
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck mock-server
        run: pnpm --filter @trancall/mock-server typecheck

      - name: Build mock-server
        run: pnpm --filter @trancall/mock-server build

      - name: Start mock-server
        run: pnpm --filter @trancall/mock-server start &
        env:
          PORT: 4010

      - name: Wait for mock-server
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:4010/health; then
              echo "mock-server ready"
              break
            fi
            echo "Waiting for mock-server... attempt $i"
            sleep 2
          done

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot iOS Simulator
        # デバイスタイプ/ランタイムをハードコードすると、ランナーのXcodeバージョンが変わる
        # (macos-14→macos-15でiOS-17-0ランタイムが存在せずsimctl createが失敗、PR #75で実測)
        # たびに壊れる。既存の事前作成済みiPhoneシミュレータを優先し、無ければランナー上で
        # 実際に利用可能な最新iOSランタイム+iPhoneデバイスタイプを動的に検出して作成する。
        run: |
          DEVICE_UDID=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries[] | .value[] | select(.name | test("iPhone")) | .udid' | head -1)
          if [ -z "$DEVICE_UDID" ]; then
            RUNTIME_ID=$(xcrun simctl list runtimes available -j | jq -r '[.runtimes[] | select(.identifier | contains("iOS"))] | last | .identifier')
            DEVICETYPE_ID=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | test("iPhone"))] | last | .identifier')
            echo "No pre-existing iPhone simulator found; creating from runtime=$RUNTIME_ID deviceType=$DEVICETYPE_ID"
            DEVICE_UDID=$(xcrun simctl create "TranCall E2E" "$DEVICETYPE_ID" "$RUNTIME_ID")
          fi
          xcrun simctl boot "$DEVICE_UDID" || true
          echo "SIMULATOR_UDID=$DEVICE_UDID" >> "$GITHUB_ENV"

      - name: Prebuild native iOS project
        run: pnpm --filter @trancall/app-mobile exec expo prebuild --platform ios --no-install
        env:
          EXPO_PUBLIC_API_BASE_URL: http://localhost:4010
          NODE_ENV: test

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: apps/mobile/ios

      - name: Build Expo app for E2E (iOS Simulator, unsigned debug)
        run: |
          set -euo pipefail
          cd apps/mobile/ios
          WORKSPACE=$(ls -d ./*.xcworkspace | head -1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null | awk '/Schemes:/{flag=1; next} flag && NF{print $1; exit}')
          if [ -z "$SCHEME" ]; then
            echo "::error::Could not determine Xcode scheme from $WORKSPACE"
            exit 1
          fi
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"
          # FORCE_BUNDLING=1: the RN "Bundle React Native code and images" build
          # phase script normally skips embedding the JS bundle for Debug builds
          # (it expects a live Metro dev server instead). CI has no Metro server
          # running, so without this the app would show a "Could not connect to
          # development server" screen instead of actually launching. This forces
          # the bundle to be embedded like a Release build while keeping Debug
          # configuration (and therefore no code signing requirement) otherwise.
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            FORCE_BUNDLING=1
        env:
          EXPO_PUBLIC_API_BASE_URL: http://localhost:4010
          NODE_ENV: test

      - name: Install app on simulator
        run: |
          set -euo pipefail
          APP_PATH=$(find apps/mobile/ios/build -name "*.app" -path "*Debug-iphonesimulator*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found under apps/mobile/ios/build (Debug-iphonesimulator)"
            exit 1
          fi
          echo "Installing $APP_PATH"
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"

      - name: Run Maestro P0 flows
        run: |
          maestro test apps/mobile/e2e/maestro/flows/ \
            --include-tags P0 \
            --config apps/mobile/e2e/maestro/config.yaml \
            --format junit \
            --output maestro-results.xml
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 60000

      - name: Upload Maestro test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results-ios
          path: |
            maestro-results.xml
            ~/.maestro/tests/**/*.png
          retention-days: 7

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots-ios-failure
          path: ~/.maestro/tests/**/*.png
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted ubuntu ランナーは既定で /dev/kvm への書き込み権限が無く、
      # android-emulator-runner がハードウェア加速なしで起動しようとしてタイムアウトする
      # (PR #75 CI実測: "ProbeKVM: This user doesn't have permissions to use KVM" 後に
      # "Timeout waiting for emulator to boot")。reactivecircus/android-emulator-runner
      # の README 記載の標準的な有効化手順。
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mock-server
        run: pnpm --filter @trancall/mock-server build

      - name: Start mock-server
        run: |
          pnpm --filter @trancall/mock-server start &
        env:
          PORT: 4010

      - name: Wait for mock-server
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:4010/health; then
              echo "mock-server ready"
              break
            fi
            echo "Waiting for mock-server... attempt $i"
            sleep 2
          done

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate placeholder google-services.json (E2E build only)
        run: |
          set -euo pipefail
          # apps/mobile/plugins/with-android-native.js only wires
          # android.googleServicesFile when this file physically exists
          # (withConditionalGoogleServicesFile). Firebase Messaging is linked
          # into the native Android project (FcmService.kt) regardless, so a
          # debug `expo prebuild` + `gradlew assembleDebug` needs *some* valid
          # google-services.json to be present or the google-services Gradle
          # plugin / Firebase SDK init can fail. This is a placeholder built
          # from public, non-secret fields only (no real Firebase project),
          # generated here and never committed to the repo.
          cat > apps/mobile/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "trancall-e2e-placeholder",
              "storage_bucket": "trancall-e2e-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "tech.hori.trancall"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyE2EPlaceholderKeyNotReal00000000000" }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Prebuild native Android project
        run: pnpm --filter @trancall/app-mobile exec expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:4010
          NODE_ENV: test

      - name: Build debug APK
        # -PbundleInDebug=true: like iOS's FORCE_BUNDLING (see the iOS job),
        # RN's Android Gradle plugin normally skips embedding the JS bundle
        # into debug APKs and expects a live Metro dev server instead. CI has
        # none running, so without this the app would fail to load its JS.
        # This is the standard Expo/RN project property for forcing bundling
        # in a debug build; unverified against this exact RN 0.81 / Expo
        # SDK 54 Gradle template locally (no Android SDK in this environment)
        # — if the debug APK still can't find its JS bundle at runtime, check
        # apps/mobile/android/app/build.gradle's `react { }` block for the
        # actual property name it reads.
        run: ./gradlew assembleDebug -PbundleInDebug=true --no-daemon
        working-directory: apps/mobile/android

      - name: Locate debug APK
        run: |
          set -euo pipefail
          APK_PATH=$(find apps/mobile/android -name "*.apk" -path "*debug*" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No debug APK found under apps/mobile/android"
            exit 1
          fi
          echo "APK_PATH=$GITHUB_WORKSPACE/$APK_PATH" >> "$GITHUB_ENV"

      - name: Run Maestro P0 flows (Android Emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r "$APK_PATH"
            maestro test "$GITHUB_WORKSPACE/apps/mobile/e2e/maestro/flows/" \
              --include-tags P0 \
              --config "$GITHUB_WORKSPACE/apps/mobile/e2e/maestro/config.yaml" \
              --format junit \
              --output "$GITHUB_WORKSPACE/maestro-results-android.xml"

      - name: Upload Maestro test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results-android
          path: |
            maestro-results-android.xml
            ~/.maestro/tests/**/*.png
          retention-days: 7

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots-android-failure
          path: ~/.maestro/tests/**/*.png
          retention-days: 7
